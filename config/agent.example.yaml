# vessel-mind agent config. Copy to config/agent.yaml to change it; without
# that file, the app reads this one. Set VESSEL_MIND_CONFIG to use another.
#
# Keys never go in this file: a provider names the env var that holds its key.

# The active configuration: hosted, local or routed.
configuration: hosted

providers:
  gemini:
    # Gemini's OpenAI-compatible endpoint, free tier (no billing account).
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    # Required. Schemes: {scheme: none} for a keyless server such as
    # llama-server; {scheme: bearer, key_env: NAME} sends
    # "Authorization: Bearer <key>"; {scheme: header, header_name: x-api-key,
    # key_env: NAME} sends the key in that header. key_env is the NAME of the
    # env var, in upper snake case; a pasted key fails validation.
    auth: {scheme: bearer, key_env: GEMINI_API_KEY}

# Each configuration is a fixed pair of models. `chosen` is the date the
# model id was pinned. The slow path uses gemini-3.5-flash, not 3.8: 3.8
# allows only 20 free requests a day.
configurations:
  hosted:
    fast: {provider: gemini, model: gemini-3.5-flash-lite, chosen: 2026-10-26}
    slow: {provider: gemini, model: gemini-3.5-flash, chosen: 2026-10-26}

# HTTP 429 and 503: exponential backoff from backoff_base seconds, honouring
# Retry-After. A wait longer than backoff_max seconds (Gemini's daily limit
# asks for about a day) fails the turn at once.
retry:
  max_retries: 3
  backoff_base: 1.0
  backoff_max: 30.0

agent:
  system: You are vessel-mind, a concise assistant. Answer in plain text.
  # Gemini counts thinking tokens against this budget.
  max_tokens: 4096

# The SQLite file for sessions, their history and proposals. It is not the
# retrieval index: the index can be rebuilt, this file cannot. A relative
# path is relative to the directory the server runs in.
state:
  path: data/state.db

# A session may start at most this many turns (cancelled ones count too),
# so one visitor cannot spend the whole free quota. Omit it for no limit.
sessions:
  max_turns: 30

# Demo mode (ADR 0002) is for the public hostname. The loop still makes a
# proposal for each write or irreversible call and the console shows it, but
# the server refuses every approval (HTTP 403, code demo_mode), so no write
# tool runs. Keep it false on localhost.
demo_mode: false

# MCP servers, started over stdio when the app starts. The model sees each
# tool as <server>_<tool>, for example notion_API-post-search.
mcp_servers:
  notion:
    # The Notion MCP server pinned by deploy/notion-mcp/package-lock.json.
    # Install it once with `npm ci --ignore-scripts` in deploy/notion-mcp.
    # It runs with node, never npx: npx would fetch whatever is newest. A
    # relative path is relative to the directory the server runs in.
    command: node
    args: [deploy/notion-mcp/node_modules/@notionhq/notion-mcp-server/bin/cli.mjs]
    # Set it to true to start the server. It then needs NOTION_TOKEN.
    enabled: false
    # The integration's token. Share the integration with ONE demo page only,
    # never a personal page. The public host uses a read-only integration
    # (ADR 0002), so Notion itself refuses a write there.
    auth: {scheme: bearer, key_env: NOTION_TOKEN}
    # The server process gets the credential as this JSON object of headers.
    # It inherits no other secret from the app (only PATH, HOME and the like).
    headers_env: OPENAPI_MCP_HEADERS
    # Only the tools named here are registered; any other tool the server
    # lists is refused with a warning. Labels are never defaulted. Page
    # content is text other people can write, so every tool taints the
    # context. A write tool only makes a proposal; it runs on Approve.
    tools:
      API-post-search: {resource: workspace, effect: read, exfil: false, taints_context: true}
      API-retrieve-a-page: {resource: workspace, effect: read, exfil: false, taints_context: true}
      API-get-block-children: {resource: workspace, effect: read, exfil: false, taints_context: true}
      API-post-page: {resource: workspace, effect: write, exfil: true, taints_context: true}
      API-patch-page: {resource: workspace, effect: write, exfil: true, taints_context: true}
      API-patch-block-children: {resource: workspace, effect: write, exfil: true, taints_context: true}
