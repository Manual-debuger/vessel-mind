[project]
name = "vessel-mind"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "fastembed==0.9.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "sqlite-vec==0.1.9",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# package = false above means this project is never installed, editable or
# otherwise, so pytest needs telling where the src layout lives.
pythonpath = ["src"]

# The dependency direction (docs/specs/a-agent-track.md §4), checked by
# tests/test_architecture.py. Each layer may import only the layers below it,
# and "agent | rag" are independent: neither imports the other. exhaustive
# makes every direct child of vessel_mind take a place here, so a new
# top-level module cannot sit outside the rules. eval (the harness behind
# task eval) sits on top: it builds what it measures from the server's config,
# and nothing imports it.
[tool.importlinter]
root_package = "vessel_mind"

[[tool.importlinter.contracts]]
name = "eval > server > agent | rag > core"
type = "layers"
containers = ["vessel_mind"]
layers = ["eval", "server", "agent | rag", "core"]
exhaustive = true

[dependency-groups]
dev = [
    "import-linter==2.15",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio==1.4.1",
    "respx==0.23.1",
    "ruff>=0.17.2",
]
