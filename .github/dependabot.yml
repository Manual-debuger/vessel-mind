# .github/dependabot.yml: one entry per component's ecosystem, and one for
# github-actions, so the pinned action SHAs are updated too. Dependabot's
# pip ecosystem reads pyproject.toml and uv.lock.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # No auto-merge: dependency PRs are reviewed like any other change.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # The base images in deploy/Dockerfile and the cloudflared image in
  # compose.yaml, each pinned by tag and digest.
  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
