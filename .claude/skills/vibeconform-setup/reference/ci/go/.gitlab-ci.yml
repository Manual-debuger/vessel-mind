# .gitlab-ci.yml for a Go repository. CI calls the verify entrypoint
# (`task verify`) on a Linux and a Windows runner, in merge request
# pipelines and on pushes to the default branch; a job of its own scans
# for known vulnerabilities, and conformance:audit runs the contract
# audit. Every image is pinned by digest (keep the tag for readers), and
# every tool to an exact version.

# Pipelines run for merge requests and for pushes to the default branch.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Every job extends .pipelines. A job with no rules: runs in branch
# pipelines only, never in a merge request pipeline.
.pipelines:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  interruptible: true

variables:
  GO_VERSION: "1.27.0"
  TASK_VERSION: "v3.53.1"
  GOLANGCI_LINT_VERSION: "v2.13.2"

# The Go toolchain and the tools verify calls, on Linux. No tags and an
# image: GitLab's shared Linux runners take the job.
.linux:
  extends: .pipelines
  image: golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
  before_script:
    - go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
    - go install golang.org/x/tools/cmd/goimports@v0.51.0
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
    - go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
    - export PATH="$(go env GOPATH)/bin:$PATH"

verify:linux:
  extends: .linux
  script:
    - task verify

# GitLab.com's Windows runners: the tag names the platform (C-05). The
# shell is PowerShell, and there is no image: Chocolatey installs Go. On
# a self-managed instance, use the tags of your Windows runners.
verify:windows:
  extends: .pipelines
  tags: [saas-windows-medium-amd64]
  before_script:
    - choco install golang --version=$env:GO_VERSION --yes --no-progress
    - $env:Path = "C:\Program Files\Go\bin;$env:USERPROFILE\go\bin;$env:Path"
    - go install github.com/go-task/task/v3/cmd/task@$env:TASK_VERSION
    - go install golang.org/x/tools/cmd/goimports@v0.51.0
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$env:GOLANGCI_LINT_VERSION
    - go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
  script:
    - task verify

# The vulnerability scan as a job of its own, so that it shows as a
# separate check (D-03).
security:
  extends: .pipelines
  image: golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
    - govulncheck ./...

# The contract audit in a job of its own. It is the only job that runs
# vibe; removing VibeConform is deleting this job. It does not call verify
# itself: vibe audit runs verify and verify-fast in a probe copy, and the
# guard probes through the hooks in .claude/settings.json. So it sets up
# every tool the entrypoints call, then installs vibe and vibe-guard
# v0.14.0-alpha.1 from the release, checked against its checksums.txt.
# VIBE_VERSION must be an exact release such as v0.12.0-alpha.1, never
# latest. Where this file says latest (it came from a vibe built from
# source), use the newest release tag; list them with
#   git ls-remote --tags https://github.com/Manual-debuger/VibeConform
conformance:audit:
  extends: .linux
  timeout: 60m
  variables:
    VIBE_VERSION: "v0.14.0-alpha.1"
  script:
    - |
      base="https://github.com/Manual-debuger/VibeConform/releases/download/$VIBE_VERSION"
      dl=$(mktemp -d) && mkdir -p "$HOME/.local/bin"
      curl -fsSL -o "$dl/checksums.txt" "$base/checksums.txt"
      for tool in vibe vibe-guard; do
        archive="${tool}_${VIBE_VERSION#v}_linux_amd64.tar.gz"
        curl -fsSL -o "$dl/$archive" "$base/$archive"
        (cd "$dl" && grep " $archive\$" checksums.txt | sha256sum -c -)
        tar -xzf "$dl/$archive" -C "$HOME/.local/bin" "$tool"
      done
    - export PATH="$HOME/.local/bin:$PATH"
    - vibe audit
