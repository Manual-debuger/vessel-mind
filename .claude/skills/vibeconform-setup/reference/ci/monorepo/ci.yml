name: CI

# .github/workflows/ci.yml for a monorepo with a Go component
# (services/api), a TypeScript component managed with pnpm (apps/web) and
# a Python component managed with uv (services/worker). CI calls the
# root verify entrypoint (`task verify`), which runs every component's
# verify, on Linux and Windows, on pull requests and on pushes to the
# default branch. Every `uses:` is pinned to a full commit SHA, and every
# tool to an exact version. Change main if the default branch has another
# name, and the paths to the repository's components.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  TASK_VERSION: "v3.53.1"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  # setup-go caches GOCACHE, which also holds test results: run the tests
  # rather than replay a cached pass. Commands other than go test ignore
  # the flag.
  GOFLAGS: "-count=1"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # go.mod, not go.sum: a module with no dependencies has no
          # go.sum, and the cache key needs a file that exists.
          cache-dependency-path: services/api/go.mod
      # Before Setup Node: its pnpm cache needs pnpm on PATH. The version
      # comes from the component's package.json packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install task and the Go tools verify calls
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
          go install golang.org/x/tools/cmd/goimports@v0.51.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install dependencies
        shell: bash
        run: |
          (cd apps/web && pnpm install --frozen-lockfile)
          (cd services/worker && uv sync --frozen)
      - name: task verify
        run: task verify

  # The vulnerability scans, one per ecosystem, as steps of their own.
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/api/go.mod
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install govulncheck and pip-audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          uv tool install pip-audit==2.9.0
      - name: govulncheck
        working-directory: services/api
        run: govulncheck ./...
      - name: pnpm audit
        working-directory: apps/web
        run: pnpm audit --audit-level high
      - name: Export the worker's locked requirements
        working-directory: services/worker
        run: uv export --frozen --no-hashes --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - name: pip-audit
        run: pip-audit -r "$RUNNER_TEMP/requirements.txt"
