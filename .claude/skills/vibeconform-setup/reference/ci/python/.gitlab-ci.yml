# .gitlab-ci.yml for a Python repository managed with uv. CI calls the
# verify entrypoint (`task verify`) on a Linux and a Windows runner, in
# merge request pipelines and on pushes to the default branch; a job of
# its own scans for known vulnerabilities, and conformance:audit runs the
# contract audit. No Go toolchain: Task comes from PyPI (go-task-bin).
# Every image is pinned by digest (keep the tag for readers), and every
# tool to an exact version.

# Pipelines run for merge requests and for pushes to the default branch.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Every job extends .pipelines. A job with no rules: runs in branch
# pipelines only, never in a merge request pipeline.
.pipelines:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  interruptible: true

variables:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.13.1"
  TASK_VERSION: "v3.53.1"

# uv and Python on Linux. No tags and an image: GitLab's shared Linux
# runners take the job.
.linux:
  extends: .pipelines
  image: ghcr.io/astral-sh/uv:0.13.1-python3.12-trixie@sha256:570b79f6364c2a640aaa73691c58e41939df3a064fb2504a5cd00c87d303f22a
  before_script:
    - uv tool install go-task-bin==${TASK_VERSION#v}
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync --frozen

verify:linux:
  extends: .linux
  script:
    - task verify

# GitLab.com's Windows runners: the tag names the platform (C-05). The
# shell is PowerShell, and there is no image: Chocolatey installs Python,
# pip installs uv. On a self-managed instance, use the tags of your
# Windows runners.
verify:windows:
  extends: .pipelines
  tags: [saas-windows-medium-amd64]
  before_script:
    - choco install python312 --version=3.12.10 --yes --no-progress
    - $env:Path = "C:\Python312;C:\Python312\Scripts;$env:USERPROFILE\.local\bin;$env:Path"
    - python -m pip install uv==$env:UV_VERSION
    - uv tool install go-task-bin==$($env:TASK_VERSION.TrimStart('v'))
    - uv sync --frozen
  script:
    - task verify

# The vulnerability scan (D-03): pip-audit checks the locked
# dependencies, not the project itself.
security:
  extends: .pipelines
  image: ghcr.io/astral-sh/uv:0.13.1-python3.12-trixie@sha256:570b79f6364c2a640aaa73691c58e41939df3a064fb2504a5cd00c87d303f22a
  script:
    - uv tool install pip-audit==2.9.0
    - export PATH="$HOME/.local/bin:$PATH"
    - uv export --frozen --no-hashes --no-emit-project --format requirements-txt -o requirements.txt
    - pip-audit -r requirements.txt

# The contract audit in a job of its own. It is the only job that runs
# vibe; removing VibeConform is deleting this job. It does not call verify
# itself: vibe audit runs verify and verify-fast in a probe copy, and the
# guard probes through the hooks in .claude/settings.json. So it sets up
# every tool the entrypoints call, then installs vibe and vibe-guard
# v0.14.0-alpha.1 from the release, checked against its checksums.txt.
# VIBE_VERSION must be an exact release such as v0.12.0-alpha.1, never
# latest. Where this file says latest (it came from a vibe built from
# source), use the newest release tag; list them with
#   git ls-remote --tags https://github.com/Manual-debuger/VibeConform
conformance:audit:
  extends: .linux
  timeout: 60m
  variables:
    VIBE_VERSION: "v0.14.0-alpha.1"
  script:
    - |
      base="https://github.com/Manual-debuger/VibeConform/releases/download/$VIBE_VERSION"
      dl=$(mktemp -d) && mkdir -p "$HOME/.local/bin"
      curl -fsSL -o "$dl/checksums.txt" "$base/checksums.txt"
      for tool in vibe vibe-guard; do
        archive="${tool}_${VIBE_VERSION#v}_linux_amd64.tar.gz"
        curl -fsSL -o "$dl/$archive" "$base/$archive"
        (cd "$dl" && grep " $archive\$" checksums.txt | sha256sum -c -)
        tar -xzf "$dl/$archive" -C "$HOME/.local/bin" "$tool"
      done
    - export PATH="$HOME/.local/bin:$PATH"
    - vibe audit
